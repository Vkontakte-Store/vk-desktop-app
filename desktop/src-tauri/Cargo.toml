[package]
name = "vkontakte-store"
version = "0.1.0"
description = "Окно ВКонтакте Store"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "vkontakte_store_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vkontakte-store"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
open = "5"
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
